<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gửi Hồng Lạc 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff6fae;
        --rose: #ff3d84;
        --gold: #ffd9a8;
        --text: #fff1f6;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
        --sans: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 30%, #4a1240, #2a0a24 70%);
        color: var(--text);
        font-family: var(--sans);
      }
      .glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
      }
      .g1 {
        width: 50vmax;
        height: 50vmax;
        background: #ff2d8a;
        left: -15vmax;
        top: -10vmax;
      }
      .g2 {
        width: 40vmax;
        height: 40vmax;
        background: #8a3dff;
        right: -12vmax;
        bottom: -10vmax;
      }
      .star {
        position: fixed;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite alternate;
        pointer-events: none;
      }
      @keyframes tw {
        from {
          opacity: 0.1;
        }
        to {
          opacity: 0.9;
          box-shadow: 0 0 8px #fff;
        }
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition:
          opacity 1s,
          transform 1s;
        z-index: 2;
      }
      #stage.hide {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        font-family: var(--serif);
        font-weight: 900;
        line-height: 1.15;
      }
      .l1 {
        font-size: clamp(1.9rem, 8.5vw, 4rem);
        color: #fff;
      }
      .l2 {
        font-size: clamp(2.6rem, 12vw, 5.8rem);
        color: var(--pink);
        text-shadow: 0 0 30px var(--rose);
      }
      .slot {
        display: inline-block;
        opacity: 0;
        min-width: 0.05em;
      }
      .slot.sp {
        min-width: 0.35em;
      }
      .slot.ok {
        opacity: 1;
        animation: pop 0.6s;
      }
      @keyframes pop {
        0% {
          transform: scale(1.6);
          filter: brightness(2.5);
        }
        100% {
          transform: none;
          filter: none;
        }
      }
      .fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        pointer-events: none;
        font-family: var(--serif);
        font-weight: 900;
        color: #ffb3d4;
        text-shadow: 0 0 14px var(--rose);
        will-change: transform;
        transition: opacity 1s;
      }
      #hint {
        font-family: var(--script);
        font-size: 1.6rem;
        color: var(--gold);
        animation: pulse 1.6s infinite;
        margin-top: 1rem;
        text-align: center;
        padding: 0 1rem;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
          transform: scale(1.05);
        }
      }
      #btn,
      .b2 {
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 99px;
        font: 600 1.05rem var(--sans);
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 28px rgba(255, 61, 132, 0.55);
        transition: transform 0.2s;
        z-index: 5;
      }
      #btn:hover,
      .b2:hover {
        transform: scale(1.07);
      }
      .b2.ghost {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border: 1px solid rgba(255, 182, 213, 0.5);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1rem;
        z-index: 4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.2s;
        overflow-y: auto;
      }
      #card.show {
        opacity: 1;
        pointer-events: auto;
      }
      .box {
        position: relative;
        margin: auto;
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 1.5rem 1.1rem 1.1rem;
        border-radius: 24px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1px solid rgba(255, 182, 213, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow:
          0 25px 90px rgba(255, 61, 132, 0.35),
          inset 0 0 40px rgba(255, 150, 200, 0.08);
        transform: scale(0.85) translateY(30px);
        transition: transform 1.2s cubic-bezier(0.2, 1.3, 0.3, 1);
      }
      #card.show .box {
        transform: none;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 99px;
        font-size: 0.66rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #4a1240;
        font-weight: 600;
        background: linear-gradient(90deg, #ffd9a8, #ffb3d4);
        box-shadow: 0 0 20px rgba(255, 217, 168, 0.5);
      }
      .big {
        font-size: 2.1rem;
        margin: 0.4rem 0 0;
        animation: beat 1.2s infinite;
      }
      @keyframes beat {
        15% {
          transform: scale(1.25);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
      }
      .t1 {
        font-family: var(--script);
        font-size: 1.25rem;
        color: var(--gold);
        margin: 0;
      }
      .t2 {
        font-family: var(--serif);
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        margin: 0 0 0.2rem;
        background: linear-gradient(
          90deg,
          #ff9ec8,
          #fff,
          #ffd9a8,
          #ff6fae,
          #ff9ec8
        );
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -250% 0;
        }
      }
      .orn {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        justify-content: center;
        color: var(--pink);
        margin: 0.4rem 0 1rem;
      }
      .orn:before,
      .orn:after {
        content: "";
        height: 1px;
        width: 22%;
        background: linear-gradient(90deg, transparent, var(--pink));
      }
      .orn:after {
        transform: scaleX(-1);
      }
      #msg {
        font-weight: 300;
        font-size: 0.88rem;
        line-height: 1.7;
        min-height: 6.4em;
        margin: 0 0.3rem;
      }
      .wishes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        margin: 0.8rem 0;
      }
      .w {
        padding: 0.55rem 0.45rem;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 213, 0.25);
        opacity: 0;
        transform: translateY(20px) scale(0.9);
        transition: all 0.8s cubic-bezier(0.2, 1.4, 0.3, 1);
      }
      .w.on {
        opacity: 1;
        transform: none;
      }
      .w i {
        font-style: normal;
        font-size: 1.2rem;
        display: block;
      }
      .w b {
        display: block;
        font-family: var(--serif);
        font-size: 0.82rem;
        color: #ffc2dc;
        margin: 0.2rem 0;
      }
      .w span {
        font-size: 0.68rem;
        font-weight: 300;
        opacity: 0.85;
        line-height: 1.5;
        display: block;
      }
      .quote {
        font-family: var(--script);
        font-size: 1.1rem;
        color: var(--gold);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .sign {
        font-family: var(--script);
        font-size: 1.2rem;
        color: var(--pink);
        margin: 0.4rem 0 0.3rem;
        opacity: 0;
        transition: opacity 1.2s;
      }
      .on2 {
        opacity: 1;
      }
      .btns {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
        opacity: 0;
        transition: opacity 1s;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        z-index: 1;
        pointer-events: none;
        animation: up linear forwards;
        filter: drop-shadow(0 0 8px rgba(255, 61, 132, 0.7));
      }
      @keyframes up {
        to {
          transform: translate(var(--dx), -115vh) rotate(var(--rot));
          opacity: 0;
        }
      }
      .burst {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        animation: bst 0.9s ease-out forwards;
      }
      @keyframes bst {
        to {
          transform: translate(var(--bx), var(--by)) scale(0.3);
          opacity: 0;
        }
      }
      * {
        cursor: none !important;
      }
      #cur {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99;
        pointer-events: none;
        font-size: 26px;
        color: #ff3d84;
        text-shadow:
          0 0 12px #ff3d84,
          0 0 28px #ff6fae;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cur span {
        display: inline-block;
        animation: beat 1.2s infinite;
      }
      .trail {
        position: fixed;
        z-index: 98;
        pointer-events: none;
        color: #ff6fae;
        transform: translate(-50%, -50%);
        animation: tr 1.1s ease-out forwards;
        text-shadow: 0 0 8px rgba(255, 61, 132, 0.8);
      }
      @keyframes tr {
        to {
          transform: translate(calc(-50% + var(--tx)), -90px) scale(0.4);
          opacity: 0;
        }
      }
      .btns small {
        font-size: 0.7rem;
        opacity: 0.65;
        letter-spacing: 0.06em;
        font-weight: 300;
      }

      /* Màn hình nhập mật khẩu */
      #lockscreen {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.2rem;
        background: radial-gradient(circle at 50% 25%, #571746, #1c071a 75%);
        transition: opacity 0.7s, visibility 0.7s;
      }
      #lockscreen.unlocked {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .lockbox {
        width: 100%;
        max-width: 360px;
        padding: 2rem 1.4rem;
        text-align: center;
        border: 1px solid rgba(255, 182, 213, 0.45);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 70px rgba(255, 61, 132, 0.25);
      }
      .lockicon { font-size: 2.5rem; margin-bottom: 0.5rem; }
      .locktitle {
        margin: 0.3rem 0 0.5rem;
        font-family: var(--serif);
        font-size: 1.8rem;
        color: #ffb3d4;
      }
      .lockdesc { font-size: 0.88rem; line-height: 1.6; opacity: 0.9; }
      #passwordInput {
        box-sizing: border-box;
        width: 100%;
        margin: 1rem 0 0.7rem;
        padding: 0.85rem 1rem;
        border-radius: 14px;
        border: 1px solid rgba(255, 182, 213, 0.5);
        background: rgba(20, 5, 20, 0.55);
        color: white;
        font: 1rem var(--sans);
        text-align: center;
        outline: none;
      }
      #passwordInput:focus { border-color: #ff6fae; box-shadow: 0 0 0 3px rgba(255,111,174,.15); }
      #unlockBtn {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 0;
        border-radius: 99px;
        color: white;
        font: 600 1rem var(--sans);
        cursor: pointer;
        background: linear-gradient(135deg, #ff6fae, #ff3d84);
        box-shadow: 0 0 24px rgba(255, 61, 132, 0.35);
      }
      #passwordError { min-height: 1.3em; margin-top: 0.65rem; color: #ffc2dc; font-size: 0.8rem; }


      #lockscreen {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        padding: 1.2rem;
        background: radial-gradient(circle at 50% 25%, #571746, #1c071a 75%);
        transition: opacity .7s, visibility .7s;
      }
      #lockscreen.unlocked { opacity: 0; visibility: hidden; pointer-events: none; }
      .lockbox {
        width: 100%; max-width: 340px; padding: 1.7rem 1.25rem;
        text-align: center; border: 1px solid rgba(255,182,213,.45);
        border-radius: 26px; background: rgba(255,255,255,.08);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 20px 70px rgba(255,61,132,.25);
      }
      .lockicon { font-size: 2.2rem; margin-bottom: .25rem; }
      .locktitle { margin: .3rem 0 .5rem; font-family: var(--serif); font-size: 1.65rem; color: #ffb3d4; }
      .lockdesc { font-size: .86rem; line-height: 1.6; opacity: .9; margin: 0 0 1rem; }
      .pass-dots { display:flex; justify-content:center; gap:8px; margin: 1rem 0 1.2rem; }
      .pass-dots span {
        width: 12px; height: 12px; border-radius: 50%;
        border: 1.5px solid #ff9ec8; background: transparent;
        transition: background .15s, box-shadow .15s;
      }
      .pass-dots span.filled { background:#ff6fae; box-shadow:0 0 12px rgba(255,111,174,.75); }
      .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto; }
      .keypad button {
        min-height:52px; border-radius:16px; border:1px solid rgba(255,182,213,.28);
        background:rgba(255,255,255,.09); color:#fff; font:600 1.2rem var(--sans);
        cursor:pointer; transition:transform .12s, background .12s;
      }
      .keypad button:active { transform:scale(.94); background:rgba(255,111,174,.3); }
      .keypad .key-alt { color:#ffc2dc; background:rgba(255,255,255,.04); font-size:1rem; }
      #passwordError { min-height:1.4em; margin-top:1rem; color:#ffc2dc; font-size:.78rem; }

    </style>
  </head>
  <body>

    <div id="lockscreen">
      <div class="lockbox">
        <div class="lockicon">🔒💗</div>
        <h1 class="locktitle">Mở khóa món quà</h1>
        <p class="lockdesc">Nhập mã số bí mật Phú dành cho Thư nha 🌷</p>
        <div id="passDots" class="pass-dots" aria-label="Đã nhập 0 trên 8 chữ số">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div id="keypad" class="keypad" aria-label="Bàn phím số">
          <button type="button" data-num="1">1</button>
          <button type="button" data-num="2">2</button>
          <button type="button" data-num="3">3</button>
          <button type="button" data-num="4">4</button>
          <button type="button" data-num="5">5</button>
          <button type="button" data-num="6">6</button>
          <button type="button" data-num="7">7</button>
          <button type="button" data-num="8">8</button>
          <button type="button" data-num="9">9</button>
          <button type="button" data-action="clear" class="key-alt">C</button>
          <button type="button" data-num="0">0</button>
          <button type="button" data-action="back" class="key-alt">⌫</button>
        </div>
        <div id="passwordError" role="status">Nhập 8 chữ số để mở thiệp 💌</div>
      </div>
    </div>

<div class="glow g1"></div>
    <div class="glow g2"></div>

    <div id="stage">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <div id="card">
      <div class="box">
        <span class="badge">20 · 11 &nbsp;Ngày Nhà giáo Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <script>

      // Mã số bí mật gồm 8 chữ số.
      const PASSWORD = "28102011";
      const lockscreen = document.getElementById("lockscreen");
      const passDots = document.getElementById("passDots");
      const passwordError = document.getElementById("passwordError");
      const keypad = document.getElementById("keypad");
      let enteredPassword = "";
      function renderPassDots() {
        [...passDots.children].forEach((dot, i) => dot.classList.toggle("filled", i < enteredPassword.length));
        passDots.setAttribute("aria-label", `Đã nhập ${enteredPassword.length} trên 8 chữ số`);
      }
      function checkPassword() {
        if (enteredPassword.length !== 8) return;
        if (enteredPassword === PASSWORD) {
          passwordError.textContent = "Mở khóa thành công 💗";
          lockscreen.classList.add("unlocked");
          setTimeout(() => lockscreen.remove(), 750);
        } else {
          passwordError.textContent = "Mã chưa đúng, Thư thử lại nhé 💗";
          enteredPassword = "";
          renderPassDots();
        }
      }
      keypad.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        if (btn.dataset.num && enteredPassword.length < 8) enteredPassword += btn.dataset.num;
        if (btn.dataset.action === "clear") enteredPassword = "";
        if (btn.dataset.action === "back") enteredPassword = enteredPassword.slice(0, -1);
        renderPassDots();
        if (enteredPassword.length === 8) checkPassword();
        else passwordError.textContent = "Nhập 8 chữ số để mở thiệp 💌";
      });

const CFG = {
        l1: "CHÚC MỪNG 20/11",
        l2: "HUỲNH THƯ",
        name: "Huỳnh Thư",
        intro:
          "Thư ơi, nhân ngày 20/11, Phú chúc Thư luôn rạng rỡ, tươi cười như những đóa hoa, luôn vui vẻ, học giỏi và đạt được mọi điều mình mong muốn. Mong rằng mỗi ngày của Thư đều thật hạnh phúc và luôn có những điều tuyệt vời bên cạnh. 💗 Phú không biết tương lai sẽ ra sao, nhưng Phú thật sự trân trọng vì hiện tại có Thư bên cạnh. Mong rằng chúng mình sẽ cùng nhau tạo nên thật nhiều kỷ niệm đẹp nha 💗🌷",
        wishes: [
          ["🌷", "Luôn rạng rỡ", "Tươi cười như những đóa hoa."],
          ["📚", "Học giỏi nhé", "Đạt được mọi điều Thư mong muốn."],
          ["✨", "Thật hạnh phúc", "Mỗi ngày đều có điều tuyệt vời bên cạnh."],
          ["💗", "Kỷ niệm đẹp", "Mong chúng mình có thêm thật nhiều kỷ niệm."],
        ],
        quote:
          "Phú không biết tương lai sẽ ra sao, nhưng Phú thật sự trân trọng vì hiện tại có Thư bên cạnh. 💗🌷",
        sign: "— Phú gửi Huỳnh Thư 💌",
      };
      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string"
          ? a[Math.floor(Math.random() * a.length)]
          : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map(
          (w) =>
            `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`,
        )
        .join("");

      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;
      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        // chữ thật
        flyers.forEach((f) =>
          mk(f, parseFloat(getComputedStyle(f.slot).fontSize)),
        );
        // chữ gây nhiễu bay lung tung
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd([
          "#ffb3d4",
          "#ff6fae",
          "#ffd9a8",
          "#e0b3ff",
          "#fff",
        ]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e,
          x: R(0, W),
          y: R(0, H),
          vx: R(-2.6, 2.6),
          vy: R(-2.6, 2.6),
          rot: R(0, 360),
          vr: R(-4, 4),
          t: R(0, 6),
          sc: 1,
          state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy),
              mx = 3.2;
            if (m > mx) {
              f.vx *= mx / m;
              f.vy *= mx / m;
            }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1)
              land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4)
              f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding) return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(
              () => {
                const r = f.slot.getBoundingClientRect();
                f.tx = r.left + r.width / 2;
                f.ty = r.top + r.height / 2;
                f.rot = (((f.rot % 360) + 540) % 360) - 180;
                f.state = "go";
                f.el.textContent = f.c;
              },
              600 + i++ * 160,
            );
          } else {
            setTimeout(
              () => {
                f.el.style.opacity = 0;
              },
              500 + R(0, 1500),
            );
            setTimeout(() => {
              f.state = "done";
              f.el.remove();
            }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });
      (document.fonts && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve()
      ).then(init);

      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++)
          burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
      }
      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
      }

      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) setTimeout(type, 40);
          else {
            document
              .querySelectorAll(".w")
              .forEach((w, k) =>
                setTimeout(() => w.classList.add("on"), k * 350),
              );
            setTimeout(() => $("quote").classList.add("on2"), 1700);
            setTimeout(() => $("sign").classList.add("on2"), 2500);
            setTimeout(() => ($("btns").style.opacity = 1), 3000);
          }
        }, 1200);
      }
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (!decoding) decode();
          else heartStorm();
        }
      });
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 50) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "💗", "💕"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1100);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          for (let i = 0; i < 6; i++)
            burst(e.clientX, e.clientY, rnd(HEARTS), 18);
        }
      });
    </script>
    </body>
</html>
